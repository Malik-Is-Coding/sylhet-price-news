# Save this in your repository as .github/workflows/update.yml (replace the old one)
name: update-reports
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install feedparser anthropic
      - name: Crime reports
        run: python collector.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - name: Price news
        if: always()
        run: python price_collector.py
      - run: |
          git config user.name "report-bot"
          git config user.email "report-bot@users.noreply.github.com"
          git add reports.json price_news.json
          git diff --cached --quiet || (git commit -m "update reports" && git push)
